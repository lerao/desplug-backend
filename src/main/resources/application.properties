spring.application.name=desplugai

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jackson.time-zone=America/Sao_Paulo

#IA INTEGRATION
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-3.5-flash-lite
# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

# Configuracao da Porta do Servidor
server.port=${PORT:8080}

# Security / JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=desplugai
security.jwt.expiration-minutes=360

# Propriedades: API Info
app.info.nome=DesplugAI
app.info.descricao=API para gerenciamento e adaptação de planos de aula.
app.info.versao=1.0.0
app.info.documentacao=/swagger-ui/index.html

# Configuração de Encode
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true